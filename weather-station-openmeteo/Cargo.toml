[package]
name = "weather-station-openmeteo"
version = "0.1.0"
edition = "2021"
description = "Open-Meteo cloud station - joins the public weather mesh from a station.toml profile"
license = "Apache-2.0"
publish = false

[[bin]]
name = "weather-station-openmeteo"
path = "src/main.rs"

[dependencies]
# The mesh half: profile tables, handshake, slot records and outbound links.
weather-station = { path = "../weather-station" }
weather-contracts = { path = "../weather-contracts" }
aimdb-core = { path = "../../aimdb/aimdb-core" }

tokio = { version = "1", features = ["full"] }
tracing = "0.1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
