[workspace]
resolver = "2"
members = [
    "weather-contracts",
    "weather-hub",
    "weather-station",
    "weather-station-knx",
    "weather-station-openmeteo",
    "weather-mesh-client",
    "weather-station-py",
]


[workspace.dependencies]
# Mirrors the aimdb workspace pin so the shared contracts crate builds no_std.
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

