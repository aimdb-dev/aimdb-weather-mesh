name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

# This workspace reaches the aimdb crates by path (`../../aimdb/...`), so every
# job checks out both repositories side by side:
#
#   $GITHUB_WORKSPACE/aimdb-weather-mesh   <- this repo
#   $GITHUB_WORKSPACE/aimdb                <- the sibling the path deps resolve to
#
# The aimdb checkout DOES need its `_external/embassy` submodule.
#
# `aimdb-knx-connector` declares `embassy-sync` as a direct path dependency
# (`path = "../_external/embassy/embassy-sync"`), gated behind its `connector`
# feature — which `std` enables. `weather-station-knx` turns on `std`, so the
# submodule is part of this workspace's dependency graph and cargo cannot even
# resolve without it. This is not the aimdb workspace's `[patch.crates-io]`
# block (that one genuinely does not apply here); it is an ordinary path dep.
#
# Note the failure mode: resolution happens before any build step, so a missing
# submodule fails *every* job — including ones that only format or lint.
#
# `submodules: true` (not `recursive`) is enough: embassy has no submodules.

jobs:
  format-and-lint:
    name: Format and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: aimdb-weather-mesh

      - uses: actions/checkout@v7
        with:
          repository: aimdb-dev/aimdb
          path: aimdb
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # `make clippy` lints the browser client for wasm32 as well as the
          # host — the fusion half only compiles there.
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            aimdb-weather-mesh/target
          key: ${{ runner.os }}-mesh-lint-${{ hashFiles('aimdb-weather-mesh/Cargo.lock') }}

      - name: Check formatting
        working-directory: aimdb-weather-mesh
        run: make fmt-check

      - name: Run clippy on all valid feature combinations
        working-directory: aimdb-weather-mesh
        run: make clippy

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: aimdb-weather-mesh

      - uses: actions/checkout@v7
        with:
          repository: aimdb-dev/aimdb
          path: aimdb
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            aimdb-weather-mesh/target
          key: ${{ runner.os }}-mesh-build-${{ hashFiles('aimdb-weather-mesh/Cargo.lock') }}

      - name: Build workspace
        working-directory: aimdb-weather-mesh
        run: make build

      - name: Test all valid feature combinations
        working-directory: aimdb-weather-mesh
        run: make test

  embedded-target:
    name: no_std Cross-compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: aimdb-weather-mesh

      - uses: actions/checkout@v7
        with:
          repository: aimdb-dev/aimdb
          path: aimdb
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            aimdb-weather-mesh/target
          key: ${{ runner.os }}-mesh-embedded-${{ hashFiles('aimdb-weather-mesh/Cargo.lock') }}

      - name: Cross-compile the no_std crates
        working-directory: aimdb-weather-mesh
        run: make test-embedded

  lockfile:
    name: Lockfile Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: aimdb-weather-mesh

      - uses: actions/checkout@v7
        with:
          repository: aimdb-dev/aimdb
          path: aimdb
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Cargo.lock is current for the sibling checkout
        working-directory: aimdb-weather-mesh
        run: make lockfile

  browser-client:
    name: Browser Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: aimdb-weather-mesh

      - uses: actions/checkout@v7
        with:
          repository: aimdb-dev/aimdb
          path: aimdb
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aimdb-weather-mesh/weather-mesh-client/js/package-lock.json

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            aimdb-weather-mesh/target
          key: ${{ runner.os }}-mesh-wasm-${{ hashFiles('aimdb-weather-mesh/Cargo.lock') }}

      # The fusion half of the client only compiles for wasm32, so an ordinary
      # `cargo build` never looks at it. This is the job that does.
      - name: Compile the client for wasm32
        working-directory: aimdb-weather-mesh
        run: make wasm-check

      # The npm package's claim is that its TypeScript types cannot drift from
      # the Rust contracts. That is only true because this runs.
      - name: Check the generated contract types are current
        working-directory: aimdb-weather-mesh
        run: make ts-bindings-check

      - name: Typecheck and test the facade
        working-directory: aimdb-weather-mesh
        run: make js
