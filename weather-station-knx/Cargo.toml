[package]
name = "weather-station-knx"
version = "0.1.0"
edition = "2021"
description = "KNX weather mesh station - republishes KNX bus sensors into an assigned mesh slot"
license = "Apache-2.0"
publish = false

[[bin]]
name = "weather-station-knx"
path = "src/main.rs"

[dependencies]
# The mesh half: profile tables, handshake, slot records and outbound links.
weather-station = { path = "../weather-station" }
weather-contracts = { path = "../weather-contracts" }
aimdb-core = { path = "../../aimdb/aimdb-core" }
aimdb-tokio-adapter = { path = "../../aimdb/aimdb-tokio-adapter" }
# `tracing` puts the connector's own gateway/reconnect reporting on the same
# subscriber as the station's; without it a gateway outage is silent.
aimdb-knx-connector = { path = "../../aimdb/aimdb-knx-connector", features = [
    "tokio-runtime",
    "tracing",
] }

tokio = { version = "1", features = ["full"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# Profile fixtures only: the station reads its profile through
# `weather_station::load_profile`.
toml = "0.8"
