[package]
name = "weather-station"
version = "0.1.0"
edition = "2021"
description = "Mesh-join behaviour shared by every weather mesh station: profile, handshake and the slot's record graph"
license = "Apache-2.0"
publish = false

[features]
# Host stations. Kept as the default so the templates and every `cargo` command
# in this workspace behave as before; an MCU build opts out with
# `--no-default-features --features embassy-runtime`.
default = ["tokio-runtime", "native-tls", "init-tracing"]

# Tokio host station: the `Station` facade, `init_tracing`, and the pre-flight
# probe. Mutually exclusive with `embassy-runtime`.
tokio-runtime = [
    "std",
    "preflight",
    "dep:aimdb-tokio-adapter",
    "aimdb-mqtt-connector/tokio-runtime",
]

# An MCU station enables *no* feature from this crate: it gets the mesh
# contract (profile, slot identity, record keys, topics) plus
# `configure_slot_records!`, and brings its own Embassy adapter and MQTT
# connector. The embassy dependencies are deliberately not declared here —
# see the crate docs for why the workspace, not this manifest, is where they
# would have to land.

# `dep:toml` because `load_profile` lives here: reading a `station.toml` is the
# mesh's rule, not a station's, and every host door goes through the same one.
std = ["aimdb-core/std", "weather-contracts/std", "aimdb-data-contracts/std", "dep:toml"]

# The pre-flight CONNECT probe: one round-trip before the graph is built, so a
# revoked slot says so at startup instead of retrying in silence.
#
# Separately gated because it is the one piece of the handshake an MCU is
# better off without — it is a second MQTT client (rumqttc, its own TLS stack,
# a Tokio runtime) bought for a single CONNECT. Without it a revoked station
# sits in the connector's reconnect loop, which on a device with no operator
# watching is the same outcome by a cheaper route.
preflight = ["std", "dep:rumqttc", "dep:tokio"]

# --- TLS backend for `mqtts://` ---
#
# Selected here and passed down, so the pre-flight probe and the connector's
# data path cannot disagree — two backends in one process means two TLS stacks,
# and the pre-flight exists to fail *before* the graph starts, not to fail
# differently from it.
#
# `native-tls` is the default, which is what every station has always built.
# `rustls` is for a build that must not carry a system OpenSSL: an FFI layer
# shipped as a shared library, above all.
native-tls = ["preflight", "rumqttc/use-native-tls", "aimdb-mqtt-connector/tokio-native-tls"]
rustls = [
    "preflight",
    "rumqttc/use-rustls",
    "dep:rustls-native-certs",
    "aimdb-mqtt-connector/tokio-rustls",
]

# Route the crate's own reporting to `tracing`. Off on Embassy, where the
# `log_*` macros compile to nothing and the connector reports via defmt.
tracing = ["dep:tracing", "aimdb-core/tracing"]

# `init_tracing`, the station-binary convenience that installs the process's
# subscriber. Split out of `tokio-runtime` (design 050) so a host build can have
# the Tokio station without `tracing-subscriber`: an FFI layer is a library
# inside somebody else's process and must not install one. In `default`, so a
# station binary and every template behave exactly as before.
init-tracing = ["tracing", "dep:tracing-subscriber"]

# Route the crate's own reporting to `log` instead (design 050) — for an FFI
# layer that hands aimdb a destination rather than installing a subscriber. Must
# be declared here and not only on aimdb-core: the `log_*` macros expand in this
# crate, so the arm is selected by *this* crate's features.
log = ["aimdb-core/log"]

# `StationHandle`: the blocking door, for callers that own their own loop —
# a Rust thread, or a Python/C/C++ station through an FFI layer above this
# crate. Host-only: `aimdb-sync` is Tokio-only by design.
sync = ["tokio-runtime", "dep:aimdb-sync"]

[dependencies]
# `migratable` is not optional here: Temperature's `Linkable` impl (the
# `to_bytes` the slot's outbound links publish through) is gated on both
# features.
weather-contracts = { path = "../weather-contracts", default-features = false, features = [
    "linkable",
    "migratable",
] }
aimdb-core = { path = "../../aimdb/aimdb-core", default-features = false, features = [
    "alloc",
] }
aimdb-data-contracts = { path = "../../aimdb/aimdb-data-contracts", default-features = false, features = [
    "linkable",
    "migratable",
] }
aimdb-mqtt-connector = { path = "../../aimdb/aimdb-mqtt-connector", default-features = false, optional = true }

serde = { version = "1.0", default-features = false, features = [
    "derive",
    "alloc",
] }
thiserror = { version = "2", default-features = false }

# --- std only ---
# `load_profile`. Optional so an MCU build, which has no filesystem to read a
# profile off, does not carry a TOML parser.
toml = { version = "0.8", optional = true }

# --- tokio-runtime only ---
aimdb-tokio-adapter = { path = "../../aimdb/aimdb-tokio-adapter", optional = true }
tracing = { version = "0.1", default-features = false, optional = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
], optional = true }

# --- preflight only ---
# Pre-flight CONNECT probe only, so a revoked credential fails at startup; the
# data path goes through aimdb-mqtt-connector. Same feature set as the
# connector's own rumqttc.
# Backend chosen by the `native-tls` / `rustls` features above, not here — see
# the note on `aimdb-mqtt-connector`'s rumqttc for why `default-features` is off.
rumqttc = { version = "0.25", default-features = false, optional = true }

# Platform trust roots for the rustls backend, loaded explicitly so a missing
# CA bundle is an error rather than the panic `TlsConfiguration::default()` has.
rustls-native-certs = { version = "0.8", optional = true }
tokio = { version = "1", features = ["time"], optional = true }

# --- sync only ---
aimdb-sync = { path = "../../aimdb/aimdb-sync", optional = true }

[dev-dependencies]
toml = "0.8"
