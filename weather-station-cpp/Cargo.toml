[package]
name = "weather-station-cpp"
version = "0.1.0"
edition = "2021"
description = "The C ABI door onto StationHandle, the header-only C++ layer over it, and a station template"
license = "Apache-2.0"
# Never published. A shipped library carries a soname, a CMake package config
# and a generated header this crate does not have yet — see README.md.
publish = false

[lib]
# The C symbol prefix is `ws_`; the crate is named for the workspace.
name = "weather_station_ffi"
# Both, and deliberately: the two link modes fail differently. The station links
# the shared one the way a consuming build would; `staticlib` is here so the
# build proves it can be produced — a consumer that static-links needs
# `cargo rustc -- --print native-static-libs` to know what else to pass.
crate-type = ["cdylib", "staticlib"]

[dependencies]
# `rustls` rather than the workspace default: this crate ships as a shared
# library into somebody else's process, which must not be handed a second
# OpenSSL. `--no-default-features` is what stops `native-tls` arriving through
# the default set alongside it.
weather-station = { path = "../weather-station", default-features = false, features = [
    "tokio-runtime",
    "rustls",
    "sync",
    # Design 050: the facade reports to `log`, so this build installs no
    # subscriber and carries no `tracing-subscriber`. `init-tracing` is
    # deliberately absent — it is the station-*binary* convenience.
    "log",
] }

# The log sink. `std` for `set_boxed_logger`, which leaks the sink on success
# and drops it on refusal — the first-wins decision, made once and in one place.
log = { version = "0.4", features = ["std"] }
