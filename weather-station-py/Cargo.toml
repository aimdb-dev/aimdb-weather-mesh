[package]
name = "weather-station-py"
version = "0.1.0"
edition = "2021"
description = "The pyo3 door onto StationHandle, and a station template over it"
license = "Apache-2.0"
# Never published. The wheel is a later tag, and it will carry the maturin
# metadata this crate does not have yet — see README.md.
publish = false

[lib]
# The Python module is `weather_station`; the crate is named for the workspace.
name = "weather_station"
crate-type = ["cdylib"]

[dependencies]
# `default-features = false` and `init-tracing` deliberately absent (design
# 050): this is a library inside somebody else's interpreter, so it must not
# carry `tracing-subscriber` or the convenience that installs a subscriber.
#
# `rustls` is the crate's only TLS backend, so this is not a choice against
# another — but with defaults off it has to be named here, or `mqtts://`
# silently has none. The C door made the same call.
weather-station = { path = "../weather-station", default-features = false, features = [
    "tokio-runtime",
    "rustls",
    "sync",
    "log",
] }

# `extension-module` keeps the module from linking libpython, which is what
# makes one build loadable by any interpreter. `abi3-py39` is the wheel matrix
# decision (§8) exercised early: one artifact per platform, not per platform ×
# Python version.
#
# Left unconditional because this crate has no Rust tests. It cannot stay that
# way in the wheel: `cargo test` builds a binary that must resolve CPython's
# symbols, and with `extension-module` on they are deliberately absent — the
# first `#[test]` that touches an interpreter fails at run time, not at link
# time. pyo3 suggests an optional feature (`extension-module = []`, enabled by
# maturin) for exactly this. Recorded here because recording what the wheel
# inherits is what this crate is for.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

# The `logging` bridge. `std` for `set_boxed_logger`, which leaks the destination
# on success and drops it on refusal — the first-wins decision, made once.
log = { version = "0.4", features = ["std"] }
